[package]
name = "liveapi"
version = "0.1.0"
edition = "2021"
description = "Rust client for the LiveAPI reference-data API."
repository = "https://github.com/liveapiio/liveapi-rust"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
